<!DOCTYPE html>
<!-- Generated with Claude Code - CS 3660 Sprint 2 -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Monitor</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --normal: #22c55e;
      --warning: #f59e0b;
      --critical: #ef4444;
      --acknowledged: #a78bfa;
      --resolved: #38bdf8;
      --offline: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      min-height: 100vh;
      padding: 1.5rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; font-weight: 700; }
    #status-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }
    #status-badge.connected { color: var(--normal); border-color: var(--normal); }
    #status-badge.error { color: var(--critical); border-color: var(--critical); }
    #time-travel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    #time-travel label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    #time-travel .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    #slider { flex: 1; accent-color: var(--resolved); cursor: pointer; }
    #time-display { font-size: 0.85rem; color: var(--text); min-width: 200px; text-align: right; }
    #live-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 0.375rem;
      border: none;
      background: var(--resolved);
      color: var(--bg);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    #live-btn:disabled { opacity: 0.4; cursor: default; }
    #fleet-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }
    .vehicle-card { background: var(--surface); border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; }
    .vehicle-header { padding: 0.6rem 1rem; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    .metric-row { display: flex; align-items: center; justify-content: space-between; padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .metric-row:last-child { border-bottom: none; }
    .metric-name { color: var(--text); font-weight: 500; }
    .metric-value { color: var(--muted); font-size: 0.8rem; }
    .state-pill { font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.05em; }
    .state-NORMAL      { background: #14532d; color: var(--normal); }
    .state-WARNING     { background: #78350f; color: var(--warning); }
    .state-CRITICAL    { background: #7f1d1d; color: var(--critical); }
    .state-ACKNOWLEDGED { background: #3b0764; color: var(--acknowledged); }
    .state-RESOLVED    { background: #0c4a6e; color: var(--resolved); }
    .state-OFFLINE     { background: #1e293b; color: var(--offline); }
    #empty { text-align: center; color: var(--muted); padding: 4rem; font-size: 0.95rem; }
  </style>
</head>
<body>
<header>
  <h1>Fleet Monitor</h1>
  <span id="status-badge">Connecting...</span>
</header>
<div id="time-travel">
  <label>Time travel — drag to reconstruct fleet state at a past moment</label>
  <div class="controls">
    <input type="range" id="slider" min="0" max="100" value="100" step="1" />
    <span id="time-display">Live</span>
    <button id="live-btn" disabled>Live</button>
  </div>
</div>
<div id="fleet-grid">
  <div id="empty">Waiting for fleet data...</div>
</div>
<script>
  let fleetState = {}, isLive = true, sliderMin = null, sliderMax = null, ws = null;
  const badge = document.getElementById('status-badge');
  const grid = document.getElementById('fleet-grid');
  const slider = document.getElementById('slider');
  const timeDisp = document.getElementById('time-display');
  const liveBtn = document.getElementById('live-btn');

  function render(state) {
    const vehicles = Object.keys(state);
    if (vehicles.length === 0) { grid.innerHTML = '<div id="empty">Waiting for fleet data...</div>'; return; }
    grid.innerHTML = vehicles.map(vid => {
      const rows = Object.entries(state[vid]).map(([metric, info]) => {
        const s = info.state ?? 'NORMAL';
        const val = info.lastValue != null ? Number(info.lastValue).toFixed(1) : '--';
        return `<div class="metric-row"><span class="metric-name">${metric}</span><span class="metric-value">${val}</span><span class="state-pill state-${s}">${s}</span></div>`;
      }).join('');
      return `<div class="vehicle-card"><div class="vehicle-header">${vid}</div>${rows}</div>`;
    }).join('');
  }

  async function fetchRange() {
    try {
      const r = await fetch('/api/events/range');
      const { earliest, latest } = await r.json();
      if (!earliest || !latest) return;
      sliderMin = new Date(earliest).getTime();
      sliderMax = new Date(latest).getTime();
    } catch {}
  }

  async function fetchStateAt(isoTime) {
    try {
      const url = isoTime ? `/api/fleet-state?upToTime=${encodeURIComponent(isoTime)}` : '/api/fleet-state';
      fleetState = await (await fetch(url)).json();
      render(fleetState);
    } catch {}
  }

  slider.addEventListener('input', async () => {
    if (!sliderMin || !sliderMax) return;
    const pct = slider.value / 100;
    if (pct >= 0.999) { goLive(); return; }
    isLive = false; liveBtn.disabled = false;
    if (ws) ws.close();
    const ts = new Date(sliderMin + pct * (sliderMax - sliderMin));
    timeDisp.textContent = ts.toLocaleString();
    await fetchStateAt(ts.toISOString());
  });

  function goLive() {
    isLive = true; liveBtn.disabled = true;
    slider.value = 100; timeDisp.textContent = 'Live';
    connectWs();
  }
  liveBtn.addEventListener('click', goLive);

  function connectWs() {
    if (ws) { ws.onclose = null; ws.close(); }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.onopen = () => { badge.textContent = 'Live'; badge.className = 'connected'; };
    ws.onmessage = (ev) => {
      if (!isLive) return;
      const msg = JSON.parse(ev.data);
      if (msg.type === 'fleet-state') { fleetState = msg.payload; render(fleetState); fetchRange(); return; }
      if (msg.type === 'mqtt' && msg.payload) {
        const { vehicleId, metric, state, value } = msg.payload;
        if (!vehicleId || !metric) return;
        if (!fleetState[vehicleId]) fleetState[vehicleId] = {};
        if (!fleetState[vehicleId][metric]) fleetState[vehicleId][metric] = { state: 'NORMAL', lastValue: null };
        if (state) fleetState[vehicleId][metric].state = state;
        if (value != null) fleetState[vehicleId][metric].lastValue = value;
        render(fleetState);
      }
    };
    ws.onclose = () => { badge.textContent = 'Disconnected'; badge.className = 'error'; if (isLive) setTimeout(connectWs, 3000); };
    ws.onerror = () => { badge.textContent = 'Error'; badge.className = 'error'; };
  }

  fetchRange();
  connectWs();
</script>
</body>
</html>
