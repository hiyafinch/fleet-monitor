<!DOCTYPE html>
<!-- Generated by Claude Code — CS 3660 Sprint 2 -->
<!-- Fleet Monitor dashboard SPA. Served by the ws-bridge Koa server.
     Uses Lit Element via CDN import map — no bundler required for dev.
     Connects to the ws-bridge over wss:// (or ws:// for local dev) and
     receives MQTT messages forwarded as JSON frames. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fleet Monitor</title>

  <!-- Import map: resolves 'lit' bare specifier to CDN without a bundler -->
  <script type="importmap">
  {
    "imports": {
      "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      background: #1f2937;
      border-bottom: 1px solid #374151;
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .03em; }

    #status {
      font-size: .8rem;
      padding: 3px 10px;
      border-radius: 9999px;
      font-weight: 600;
    }
    #status.connected    { background: #14532d; color: #4ade80; }
    #status.disconnected { background: #450a0a; color: #f87171; }
    #status.connecting   { background: #1c1917; color: #a8a29e; }

    main { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

    .slider-bar {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: .75rem 1rem;
    }

    section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 1rem 1.25rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Fleet Monitor</h1>
  <span id="status" class="connecting">Connecting...</span>
</header>

<main>
  <div class="slider-bar">
    <time-travel-slider id="slider"></time-travel-slider>
  </div>

  <section>
    <fleet-map id="fleet-map"></fleet-map>
  </section>

  <section>
    <alert-panel id="alert-panel"></alert-panel>
  </section>
</main>

<!-- Lit components -->
<script type="module" src="/dashboard/components/fleet-map.js"></script>
<script type="module" src="/dashboard/components/alert-panel.js"></script>
<script type="module" src="/dashboard/components/time-travel-slider.js"></script>

<script type="module">
  // ---- DOM refs ----
  const statusEl   = document.getElementById('status');
  const fleetMap   = document.getElementById('fleet-map');
  const alertPanel = document.getElementById('alert-panel');
  const slider     = document.getElementById('slider');

  // Auth token for ACK/RESOLVE commands (matches AUTH_TOKEN env var; default 'changeme')
  const AUTH_TOKEN = 'changeme';

  // ---- WebSocket connection ----
  // Automatically uses wss:// when served over HTTPS (production via Caddy),
  // ws:// when served over HTTP (local dev).
  const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`;
  let ws;
  let reconnectTimer;

  // Current fleet state — updated by live WS messages or time-travel API calls
  let fleetState = {};
  let isLive = true;

  function applyFleetState(state) {
    fleetState = state;
    fleetMap.vehicles   = { ...state };
    alertPanel.vehicles = { ...state };
  }

  function setStatus(label, cls) {
    statusEl.textContent = label;
    statusEl.className   = cls;
  }

  function connect() {
    setStatus('Connecting...', 'connecting');
    ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      setStatus('Connected', 'connected');
      clearTimeout(reconnectTimer);
    };

    ws.onmessage = (ev) => {
      let frame;
      try { frame = JSON.parse(ev.data); } catch { return; }

      // On connect the bridge sends a full fleet-state snapshot for catch-up
      if (frame.type === 'fleet-state') {
        applyFleetState(frame.payload);
        return;
      }

      // Only update live view if the slider is at LIVE position
      if (!isLive) return;

      if (frame.type === 'mqtt') {
        const { topic, payload } = frame;

        // alerts/{vehicleId}/{metric} — update state
        const alertMatch = topic.match(/^alerts\/([^/]+)\/([^/]+)$/);
        if (alertMatch) {
          const [, vehicleId, metric] = alertMatch;
          if (!fleetState[vehicleId]) fleetState[vehicleId] = {};
          if (!fleetState[vehicleId][metric]) {
            fleetState[vehicleId][metric] = { state: 'NORMAL', lastValue: null, lastSeen: null };
          }
          fleetState[vehicleId][metric].state     = payload.state;
          fleetState[vehicleId][metric].lastValue = payload.value;
          fleetState[vehicleId][metric].lastSeen  = payload.ts;
          applyFleetState(fleetState);
        }
      }
    };

    ws.onclose = () => {
      setStatus('Disconnected', 'disconnected');
      reconnectTimer = setTimeout(connect, 3000);
    };

    ws.onerror = () => ws.close();
  }

  connect();

  // ---- Time-travel slider ----
  async function loadEventRange() {
    try {
      const res  = await fetch('/api/events/range');
      const data = await res.json();
      slider.earliest = data.earliest;
      slider.latest   = data.latest;
    } catch { /* store may be empty on first load */ }
  }

  loadEventRange();
  // Refresh slider bounds every 30s so it stays current
  setInterval(loadEventRange, 30000);

  slider.addEventListener('time-travel', async (e) => {
    if (e.detail.live) {
      isLive = true;
      // Reconnect to get the latest full state immediately
      if (ws && ws.readyState === WebSocket.OPEN) {
        const res   = await fetch('/api/fleet-state');
        const state = await res.json();
        applyFleetState(state);
      }
    } else {
      isLive = false;
      try {
        const res   = await fetch(`/api/fleet-state?upToTime=${encodeURIComponent(e.detail.upToTime)}`);
        const state = await res.json();
        applyFleetState(state);
      } catch (err) {
        console.error('time-travel fetch failed:', err);
      }
    }
  });

  // ---- ACK / RESOLVE commands ----
  document.addEventListener('alert-command', async (e) => {
    const { type, vehicleId, metric } = e.detail;
    try {
      const res = await fetch('/api/command', {
        method:  'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${AUTH_TOKEN}`,
        },
        body: JSON.stringify({ type, vehicleId, metric, operator: 'dashboard' }),
      });
      if (!res.ok) console.error('command failed:', await res.text());
    } catch (err) {
      console.error('command error:', err);
    }
  });
</script>
</body>
</html>
